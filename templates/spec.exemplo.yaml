stack: motor BVC-OS (Node nativo, app/) + API oficial do WhatsApp + Postgres/SQLite + LLM (gpt-oss-20b)
diferenciais: confirmação automática, reagendamento em 1 clique, relatório semanal de faltas
metrica_sucesso: faltas por semana e tempo de recepção gasto em confirmação
